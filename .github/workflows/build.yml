name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      OPUS_BUNDLED: "1"
      OPUS_STATIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # NASM lets OpenH264 (the Go Live video encoder) use its fast
      # assembly code; without it the build silently falls back to plain C.
      - uses: ilammy/setup-nasm@v1
      - name: Check NASM
        run: nasm -v
      - uses: Swatinem/rust-cache@v2
        with:
          # New cache so OpenH264 gets rebuilt with NASM (its build script
          # doesn't notice NASM appearing on its own).
          prefix-key: "v1-nasm"
      - name: Build
        run: cargo build --release
      - name: Check the video encoder was built with NASM
        shell: bash
        run: |
          out=$(cat target/release/build/openh264-sys2-*/output)
          if echo "$out" | grep -qiE "not using any assembly|NASM compilation disabled"; then
            echo "$out"; echo "OpenH264 was built WITHOUT assembly"; exit 1
          fi
          echo "OpenH264 built with NASM assembly"
      - name: Size
        shell: bash
        run: ls -l target/release/tinycord.exe
      - name: Publish to the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest target/release/tinycord.exe \
            --title "tinycord build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Download tinycord.exe below."
