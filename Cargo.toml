[package]
name = "tinycord"
version = "0.3.7"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wincheck)'] }

[dependencies]
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "receive", "rustls", "tungstenite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots", "url"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
cpal = "0.18"
parking_lot = "0.12"
async-trait = "0.1"
# Needed so songbird can decode our raw f32 mic stream.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Controls", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_HiDpi", "Win32_System_SystemServices", "Win32_Media",
] }
nnnoiseless = { version = "0.5.2", default-features = false }
rubato = "0.16"
openh264 = "0.9.9"

# Screen capture (DXGI Desktop Duplication) and system-sound capture.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
] }
wasapi = "0.27"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
songbird = { path = "vendor/songbird" }
openh264 = { path = "vendor/openh264" }
